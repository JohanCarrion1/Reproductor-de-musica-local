name: Compilar APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/reproductor.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/reproductor.jks" >> "$GITHUB_ENV"
            echo "Firmando con la clave fija del repo."
          else
            echo "::warning::Falta el secreto KEYSTORE_BASE64. El APK sale con una clave temporal y NO se podra instalar como actualizacion de otra version."
          fi

      - name: Leer la versión
        id: ver
        run: echo "name=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Permisos de gradlew
        run: chmod +x gradlew

      - name: Compilar APK release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Nombrar el APK con su versión
        run: cp app/build/outputs/apk/release/app-release.apk "Reproductor-v${{ steps.ver.outputs.name }}.apk"

      - name: Mostrar la firma del APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "Reproductor-v${{ steps.ver.outputs.name }}.apk" | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: Reproductor-v${{ steps.ver.outputs.name }}
          path: Reproductor-v${{ steps.ver.outputs.name }}.apk

      - name: Publicar release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Reproductor-v${{ steps.ver.outputs.name }}.apk
